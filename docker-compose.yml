version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: clickfield-radar-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: clickfield_secret_pass
      POSTGRES_DB: clickfield_radar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clickfield-radar-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:clickfield_secret_pass@db:5432/clickfield_radar
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clickfield-radar-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
