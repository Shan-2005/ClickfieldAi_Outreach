version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: clickfield-radar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clickfield_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-clickfield_radar}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clickfield-radar-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-clickfield_secret_pass}@db:5432/${POSTGRES_DB:-clickfield_radar}
    ports:
      - "8000:8000"
    volumes:
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clickfield-radar-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: clickfield-radar-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
